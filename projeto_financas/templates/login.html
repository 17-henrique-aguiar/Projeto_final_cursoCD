{% extends 'base.html' %}
{% block content %}

<div class="container mt-5" style="max-width: 400px;">
    <h2 class="fw-bold mb-4 text-center">Login</h2>

    <form method="post">
        <div class="mb-3">
            <label class="form-label">Usuário</label>
            <input name="username" class="form-control form-control-lg" placeholder="Digite seu usuário">
        </div>

        <div class="mb-4">
            <label class="form-label">Senha</label>
            <input name="password" type="password" class="form-control form-control-lg" placeholder="Digite sua senha">
        </div>

        <div class="d-grid gap-2">
            <button class="btn btn-primary btn-lg">Entrar</button>
            <a class="btn btn-link text-decoration-none" href="/cadastro">Criar conta</a>
        </div>
    </form>
</div>

{% endblock %}
