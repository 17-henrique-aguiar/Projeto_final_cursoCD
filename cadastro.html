{% extends 'base.html' %}
{% block content %}

<div class="container mt-5" style="max-width: 400px;">
    <h2 class="fw-bold mb-4 text-center">Criar</h2>

    <form method="post">
        <div class="mb-3">
            <input name="username" class="form-control form-control-lg" placeholder="Escolha um usuário">
        </div>

        <div class="mb-4">
            <input name="password" type="password" class="form-control form-control-lg" placeholder="Crie uma senha">
        </div>

        <div class="d-grid">
            <button class="btn btn-success btn-lg">Finalizar Cadastro</button>
        </div>

        <div class="text-center mt-3">
            <a href="/login" class="text-muted small text-decoration-none">Já tenho uma conta</a>
        </div>
    </form>
</div>

{% endblock %}
